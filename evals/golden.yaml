# Golden eval set: seed from the KB intake (2026-11-09). Grows to 30–50 in Phase 8.
# must: facts the answer has to contain (case-insensitive substrings, any-of lists allowed)
# never: strings that must NOT appear
# sources: KB files a good answer should cite (checked once RAG lands in Phase 5)

