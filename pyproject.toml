[project]
name = "jinbo"
version = "0.1.0"
description = "JinBo 2.0: a RAG + tools portfolio assistant"
readme = "README.md"
authors = [
    { name = "Prateesh-Sulikeri", email = "sulikeriprateesh7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jinbo = "jinbo.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["legacy", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
